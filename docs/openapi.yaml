openapi: 3.1.0
info:
  title: Kuafu API
  version: 0.1.0
  description: >
    Kuafu lab/prototype API contract. Production mode still fails fast until
    Kubernetes runtime, MongoDB deployment, scheduler adapters, and OIDC/JWT
    authentication are wired.
servers:
  - url: http://localhost:8080
    description: Local lab mode
  - url: http://{a00PublicIp}:30000
    description: A00 external lab/NodePort entry
    variables:
      a00PublicIp:
        default: 52.171.138.19
security: []
tags:
  - name: health
  - name: inventory
  - name: jobs
  - name: system
  - name: queues
  - name: reservations
  - name: cluster
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /ready:
    get:
      tags: [health]
      operationId: getReady
      responses:
        '200':
          description: Readiness status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
  /api/v1/cluster/summary:
    get:
      tags: [cluster]
      operationId: getClusterSummary
      responses:
        '200':
          description: Cluster summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSummary'
  /api/v1/nodes:
    get:
      tags: [inventory]
      operationId: listNodes
      responses:
        '200':
          description: Node list
          content:
            application/json:
              schema:
                type: object
                required: [nodes, count]
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                  count:
                    type: integer
  /api/v1/nodes/{name}:
    get:
      tags: [inventory]
      operationId: getNode
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/gpus:
    get:
      tags: [inventory]
      operationId: listGPUs
      parameters:
        - name: node
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: GPU list
          content:
            application/json:
              schema:
                type: object
                required: [gpus, count]
                properties:
                  gpus:
                    type: array
                    items:
                      $ref: '#/components/schemas/GPU'
                  count:
                    type: integer
  /api/v1/gpus/{id}:
    get:
      tags: [inventory]
      operationId: getGPU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GPU detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPU'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/gpu-telemetry:
    get:
      tags: [inventory]
      operationId: getGpuTelemetry
      description: Live GPU utilization, memory, power, temperature, and process telemetry. Lab/A00 mode reads nvidia-smi and falls back to repository inventory if unavailable.
      responses:
        '200':
          description: GPU telemetry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GPUTelemetrySnapshot'
  /api/v1/system/reserved-env:
    get:
      tags: [system]
      operationId: getReservedEnv
      description: Kuafu system-reserved environment variables injected into rendered distributed task instances. User shared/template env cannot override these names.
      responses:
        '200':
          description: Reserved environment variable catalog
          content:
            application/json:
              schema:
                type: object
                required: [reservedEnv]
                properties:
                  reservedEnv:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservedEnvVar'
  /api/v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                required: [jobs, count]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  count:
                    type: integer
    post:
      tags: [jobs]
      operationId: submitJob
      description: >
        Submit a job. If `project` is set, dev header `X-Kuafu-User` is used
        by the current scaffold to authorize project submitter/admin role.
        Production must replace this with OIDC/JWT auth.
      parameters:
        - $ref: '#/components/parameters/KuafuUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '201':
          description: Job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [jobs]
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Canceled job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/jobs/{id}/logs:
    get:
      tags: [jobs]
      operationId: getJobLogs
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  logs:
                    type: array
                    items:
                      type: string
  /api/v1/jobs/{id}/start:
    post:
      tags: [jobs]
      operationId: startJob
      description: Requeue a stopped, canceled, failed, or completed job.
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Started job intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/jobs/{id}/stop:
    post:
      tags: [jobs]
      operationId: stopJob
      description: Stop a queued or running job and release any allocated GPUs.
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Stopped job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/jobs/{id}/restart:
    post:
      tags: [jobs]
      operationId: restartJob
      description: Release current allocation if needed, clear terminal state, and return the job to the queue.
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Restarted job intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/jobs/{id}/metrics:
    get:
      tags: [jobs]
      operationId: getJobMetrics
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Current job-scoped GPU usage snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                  generatedAt:
                    type: string
                    format: date-time
                  gpus:
                    type: array
                    items:
                      $ref: '#/components/schemas/GPUUsage'
  /api/v1/reservations:
    get:
      tags: [reservations]
      operationId: listReservations
      responses:
        '200':
          description: Reservation list
          content:
            application/json:
              schema:
                type: object
                required: [reservations, count]
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeReservation'
                  count:
                    type: integer
    post:
      tags: [reservations]
      operationId: createReservation
      description: Create a lab-mode whole-node reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeReservation'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/reservations/{id}:
    get:
      tags: [reservations]
      operationId: getReservation
      parameters:
        - $ref: '#/components/parameters/ReservationID'
      responses:
        '200':
          description: Reservation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeReservation'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [reservations]
      operationId: releaseReservation
      parameters:
        - $ref: '#/components/parameters/ReservationID'
      responses:
        '200':
          description: Released reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeReservation'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/reservations/{id}/commands:
    post:
      tags: [reservations]
      operationId: createReservationCommand
      description: Record and render exact per-node Docker commands for a reservation. Lab mode does not execute remotely yet.
      parameters:
        - $ref: '#/components/parameters/ReservationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCommandRequest'
      responses:
        '201':
          description: Command recorded and rendered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCommand'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/queues:
    get:
      tags: [queues]
      operationId: listQueues
      responses:
        '200':
          description: Queue list
          content:
            application/json:
              schema:
                type: object
                required: [queues, count]
                properties:
                  queues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Queue'
                  count:
                    type: integer
    post:
      tags: [queues]
      operationId: createQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
      responses:
        '201':
          description: Queue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/queues/{name}:
    get:
      tags: [queues]
      operationId: getQueue
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: [queues]
      operationId: updateQueue
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
      responses:
        '200':
          description: Queue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [queues]
      operationId: deleteQueue
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  parameters:
    NodeName:
      name: name
      in: path
      required: true
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReservationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    KuafuUser:
      name: X-Kuafu-User
      in: header
      required: false
      schema:
        type: string
      description: Development-only identity scaffold. Lab mode seeds lab-admin, lab-user, and lab-viewer. Production must use OIDC/JWT.
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Node:
      type: object
      properties:
        name:
          type: string
        hostname:
          type: string
        privateIp:
          type: string
        infinibandIps:
          type: array
          items:
            type: string
        os:
          type: string
        kernel:
          type: string
        cpuCount:
          type: integer
        memoryGb:
          type: integer
        diskGb:
          type: integer
        gpuCount:
          type: integer
        status:
          type: string
          enum: [Ready, NotReady, Unknown, Maintenance]
        labels:
          type: object
          additionalProperties:
            type: string
        lastHeartbeat:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    GPU:
      type: object
      properties:
        id:
          type: string
        nodeName:
          type: string
        index:
          type: integer
        model:
          type: string
        memoryMb:
          type: integer
        uuid:
          type: string
        driver:
          type: string
        status:
          type: string
          enum: [Available, Allocated, Unavailable, Unknown]
        allocatedTo:
          type: string
        createdAt:
          type: string
          format: date-time
    JobSubmitRequest:
      type: object
      required: [name, queue]
      properties:
        name:
          type: string
        project:
          type: string
        queue:
          type: string
        command:
          type: string
        image:
          type: string
        gpuCount:
          type: integer
          minimum: 1
        sharedEnv:
          type: array
          description: User-provided shared environment variables. Reserved Kuafu names are rejected.
          items:
            $ref: '#/components/schemas/EnvVar'
        taskTemplates:
          type: array
          description: Distributed task templates. When set, Kuafu derives total GPU demand from replicas x GPUCount and renders task instances with system reserved env.
          items:
            $ref: '#/components/schemas/TaskTemplate'
        tasks:
          type: array
          description: Optional reviewed rendered task command overrides keyed by rank.
          items:
            $ref: '#/components/schemas/TaskInstance'
    Job:
      allOf:
        - $ref: '#/components/schemas/JobSubmitRequest'
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [Queued, Running, Completed, Failed, Canceled, Stopped]
            runtimeId:
              type: string
            submittedAt:
              type: string
              format: date-time
            startedAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
            allocatedGpus:
              type: array
              items:
                type: string
            logs:
              type: array
              items:
                type: string
            exitCode:
              type: integer
            errorMsg:
              type: string
            sharedEnv:
              type: array
              items:
                $ref: '#/components/schemas/EnvVar'
            taskTemplates:
              type: array
              items:
                $ref: '#/components/schemas/TaskTemplate'
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/TaskInstance'
    EnvVar:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    ReservedEnvVar:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        description:
          type: string
    TaskTemplate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        replicas:
          type: integer
        image:
          type: string
        command:
          type: string
        gpuCount:
          type: integer
        cpuCount:
          type: integer
        memoryGb:
          type: integer
        startOrdinal:
          type: integer
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
    TaskInstance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        rank:
          type: integer
        ordinal:
          type: integer
        address:
          type: string
        image:
          type: string
        command:
          type: string
        gpuCount:
          type: integer
        cpuCount:
          type: integer
        memoryGb:
          type: integer
        allocatedGpus:
          type: array
          items:
            type: string
        status:
          type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
        cpuUsage:
          type: integer
        memoryUsedMb:
          type: integer
    Queue:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [Active, Paused]
        project:
          type: string
        maxGpus:
          type: integer
        softGpus:
          type: integer
        maxGpusPerJob:
          type: integer
        maxQueuedJobs:
          type: integer
        maxRunningJobs:
          type: integer
        priority:
          type: integer
        allowBurst:
          type: boolean
        jobsQueued:
          type: integer
        jobsRunning:
          type: integer
    ReservationCreateRequest:
      type: object
      required: [name, nodeNames]
      properties:
        name:
          type: string
        owner:
          type: string
        nodeNames:
          type: array
          items:
            type: string
        durationHours:
          type: integer
    ReservationCommandRequest:
      type: object
      required: [image, startCommand]
      properties:
        image:
          type: string
        dockerRunOptions:
          type: string
        entryPoint:
          type: string
        startCommand:
          type: string
        workingDirectory:
          type: string
        environment:
          type: array
          items:
            type: string
    ReservationNodeCommand:
      type: object
      properties:
        nodeName:
          type: string
        command:
          type: string
    ReservationCommand:
      allOf:
        - $ref: '#/components/schemas/ReservationCommandRequest'
        - type: object
          properties:
            id:
              type: string
            renderedCommands:
              type: array
              items:
                $ref: '#/components/schemas/ReservationNodeCommand'
            status:
              type: string
              enum: [Recorded]
            createdAt:
              type: string
              format: date-time
            logs:
              type: array
              items:
                type: string
    NodeReservation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        nodeNames:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Active, Released]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        commands:
          type: array
          items:
            $ref: '#/components/schemas/ReservationCommand'
    GPUUsage:
      type: object
      properties:
        gpuId:
          type: string
        nodeName:
          type: string
        index:
          type: integer
        model:
          type: string
        memoryTotalMb:
          type: integer
        memoryUsedMb:
          type: integer
        utilization:
          type: integer
        powerWatts:
          type: integer
        temperatureC:
          type: integer
        health:
          type: string
    GPUTelemetrySnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
        error:
          type: string
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/GPUTelemetry'
    GPUTelemetry:
      type: object
      properties:
        index:
          type: integer
        uuid:
          type: string
        nodeName:
          type: string
        name:
          type: string
        memoryTotalMb:
          type: integer
        memoryUsedMb:
          type: integer
        utilization:
          type: integer
        powerWatts:
          type: integer
        temperatureC:
          type: integer
        processes:
          type: array
          items:
            $ref: '#/components/schemas/GPUProcess'
    GPUProcess:
      type: object
      properties:
        gpuIndex:
          type: integer
        pid:
          type: integer
        processName:
          type: string
        usedMemoryMb:
          type: integer
    ClusterSummary:
      type: object
      properties:
        cluster:
          type: object
        jobs:
          type: object
        queues:
          type: integer